services:
  - type: web
    name: recoverai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # Paste your key in Render dashboard
      - key: SMTP_EMAIL
        value: batman.uses.ai@gmail.com
      - key: SMTP_PASSWORD
        sync: false   # Paste your App Password in Render dashboard
    plan: free
